services:
  - type: web
    name: unica-app
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run seed && npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_LOGIN
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: unica-data
      mountPath: /var/data
      sizeGB: 1

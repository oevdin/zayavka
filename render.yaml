services:
  - type: web
    name: unica-app
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run seed && npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_LOGIN
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
